<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark War: Survival Season 6 Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .toolbar-header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .toolbar h1 {
    font-size: 16px;
    font-weight: 600;
    color: #e94560;
    margin-right: auto;
  }

  .hamburger {
    display: none;
    background: none;
    border: 1px solid #0f3460;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 20px;
    padding: 4px 8px;
    cursor: pointer;
    line-height: 1;
  }
  .hamburger:hover { background: #0f3460; }

  .toolbar-body {
    display: contents;
  }

  .mobile-always {
    display: contents;
  }
  .mobile-hidden {
    display: contents;
  }

  .separator {
    width: 1px;
    height: 28px;
    background: #0f3460;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tool-group label {
    font-size: 13px;
    color: #a0a0b8;
  }

  @media (max-width: 800px) {
    .toolbar {
      padding: 8px 12px;
      gap: 8px;
    }
    .toolbar-header { width: 100%; }
    .toolbar h1 { font-size: 14px; }
    .hamburger { display: block; }

    /* Always-visible row: colors + export */
    .mobile-always {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    /* Hidden section: only show when hamburger opened */
    .mobile-hidden {
      display: none;
    }
    .toolbar-body.open .mobile-hidden {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding-top: 8px;
      border-top: 1px solid #0f3460;
    }

    .separator { display: none; }
    .swatch { width: 24px; height: 24px; }
    .btn { padding: 5px 10px; font-size: 12px; }
    .tolerance-group input[type="range"] { width: 60px; }
    .canvas-container { padding: 8px; }
    .edit-bar { padding: 6px 12px; gap: 6px; }
    .edit-bar .btn { padding: 4px 8px; font-size: 11px; }
    .hint { font-size: 11px; padding: 6px 12px; }
  }

  .color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }

  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; transform: scale(1.15); }

  input[type="color"] {
    width: 28px;
    height: 28px;
    border: 2px solid #0f3460;
    border-radius: 4px;
    cursor: pointer;
    background: none;
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

  .btn {
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid #0f3460;
    background: #16213e;
    color: #e0e0e0;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn:hover { background: #0f3460; }
  .btn.danger { border-color: #e94560; color: #e94560; }
  .btn.danger:hover { background: #e94560; color: #fff; }

  .tolerance-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tolerance-group input[type="range"] {
    width: 80px;
    accent-color: #e94560;
  }

  .tolerance-value {
    font-size: 12px;
    color: #a0a0b8;
    min-width: 24px;
  }

  .canvas-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 20px;
    position: relative;
  }

  .canvas-wrapper {
    position: relative;
    display: inline-block;
  }

  .canvas-wrapper canvas {
    display: block;
  }

  #canvas {
    background: #fff;
    cursor: crosshair;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .edit-dropdown {
    position: relative;
    display: inline-block;
  }

  .edit-dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 4px;
    z-index: 10;
    white-space: nowrap;
  }

  .edit-dropdown-menu.open { display: flex; flex-direction: column; gap: 2px; }
  .edit-dropdown-menu .btn { text-align: left; width: 100%; }

  #overlayCanvas, #levelsCanvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .btn.active {
    background: #0f3460;
    border-color: #4a90d9;
    color: #4a90d9;
  }

  .btn.edit-active {
    background: #e94560;
    border-color: #e94560;
    color: #fff;
  }

  .edit-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    background: #0f3460;
    border-bottom: 1px solid #e94560;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .edit-bar label {
    font-size: 13px;
    color: #f5a623;
    font-weight: 600;
  }

  .edit-bar .btn { font-size: 12px; }

  #overlayCanvas.editing {
    pointer-events: auto;
    cursor: grab;
  }

  #overlayCanvas.adding {
    pointer-events: auto;
    cursor: crosshair;
  }

  .hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(22, 33, 62, 0.9);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    color: #a0a0b8;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.8s ease;
  }
  .hint.hidden {
    opacity: 0;
  }

  .zoom-controls {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .zoom-controls .btn {
    width: 28px;
    height: 28px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .zoom-label {
    font-size: 12px;
    color: #a0a0b8;
    min-width: 36px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-header">
    <h1>Dark War: Survival Season 6 Map</h1>
    <button class="hamburger" id="hamburgerBtn">&#9776;</button>
  </div>

  <div class="toolbar-body" id="toolbarBody">

    <!-- Always visible on mobile: colors + export -->
    <div class="mobile-always">
      <div class="tool-group">
        <label>Color:</label>
        <div class="color-swatches" id="swatches"></div>
        <input type="color" id="customColor" value="#4a90d9" title="Custom color">
      </div>
      <div class="separator"></div>
      <div class="tool-group">
        <button class="btn" id="exportBtn">Export PNG</button>
      </div>
    </div>

    <!-- Hidden on mobile until hamburger opened -->
    <div class="mobile-hidden" id="mobileHidden">
      <div class="separator"></div>

      <div class="tool-group">
        <label>Eraser:</label>
        <button class="btn" id="eraserBtn" title="Erase a region back to white">Off</button>
      </div>

      <div class="separator"></div>

      <div class="tool-group tolerance-group">
        <label>Tolerance:</label>
        <input type="range" id="tolerance" min="0" max="128" value="32">
        <span class="tolerance-value" id="toleranceValue">32</span>
      </div>

      <div class="separator"></div>

      <div class="tool-group zoom-controls">
        <button class="btn" id="zoomOut">-</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="btn" id="zoomIn">+</button>
        <button class="btn" id="zoomFit">Fit</button>
      </div>

      <div class="separator"></div>

      <div class="tool-group">
        <button class="btn active" id="gatesBtn" title="Toggle gate markers">Gates: On</button>
        <button class="btn active" id="passesBtn" title="Toggle free passes">Passes: On</button>
        <button class="btn active" id="levelsBtn" title="Toggle area levels">Levels: On</button>
        <div class="edit-dropdown">
          <button class="btn" id="editToggleBtn" title="Edit markers">Edit</button>
          <div class="edit-dropdown-menu" id="editDropdown">
            <button class="btn" id="editGatesBtn">Gates</button>
            <button class="btn" id="editPassesBtn">Passes</button>
            <button class="btn" id="editLevelsBtn">Levels</button>
          </div>
        </div>
      </div>

      <div class="separator"></div>

      <div class="tool-group">
        <button class="btn" id="undoBtn" title="Undo last fill (Ctrl+Z)">Undo</button>
        <button class="btn danger" id="resetBtn">Reset</button>
      </div>
    </div>

  </div>
</div>

<div class="edit-bar" id="editBar" style="display:none;">
  <label id="editLabel">Gate Editor:</label>
  <button class="btn edit-active" id="editMoveBtn">Move</button>
  <button class="btn" id="editAddBtn">Add New</button>
  <button class="btn" id="editRotateBtn" style="display:none;">Rotate</button>
  <span id="levelPicker" style="display:none;">
    <button class="btn edit-active" data-lvl="1">1</button>
    <button class="btn" data-lvl="2">2</button>
    <button class="btn" data-lvl="3">3</button>
    <button class="btn" data-lvl="4">4</button>
    <button class="btn" data-lvl="5">5</button>
    <button class="btn" data-lvl="6">6</button>
    <button class="btn" data-lvl="7">7</button>
  </span>
  <button class="btn" id="editDeleteBtn">Delete</button>
  <div class="separator" style="height:20px;"></div>
  <button class="btn" id="editSaveBtn" style="border-color:#7ed321;color:#7ed321;">Save</button>
  <button class="btn" id="editExportJsonBtn">Copy JSON</button>
  <button class="btn danger" id="editDoneBtn">Done</button>
  <span style="font-size:11px;color:#a0a0b8;margin-left:8px;" id="editHint">Drag to move</span>
</div>

<div class="canvas-container" id="canvasContainer">
  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="canvas"></canvas>
    <canvas id="overlayCanvas"></canvas>
    <canvas id="levelsCanvas"></canvas>
  </div>
</div>

<div class="hint">Click any enclosed area to fill it with the selected color</div>

<script>
const PALETTE = [

  '#8b572a', '#417505', '#d0021b', '#9b9b9b', '#ffffff',

// Hamburger menu toggle
document.getElementById('hamburgerBtn').addEventListener('click', () => {
  document.getElementById('toolbarBody').classList.toggle('open');
});

// Auto-fade hint after 4s
setTimeout(() => {
  const hint = document.querySelector('.hint');
  if (hint) hint.classList.add('hidden');
}, 4000);

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');

const levelsCtx = levelsCanvas.getContext('2d');
const container = document.getElementById('canvasContainer');
const wrapper = document.getElementById('canvasWrapper');

let eraserMode = false;
let tolerance = 32;
let zoom = 1;
let history = [];
let baseImageData = null;
let showGates = true;
let showPasses = true;
let showLevels = true;
let editMode = false;
let editTarget = 'gates'; // 'gates', 'passes', or 'levels'
let editTool = 'move'; // 'move', 'add', 'delete', 'rotate'
let dragIndex = -1;
let isDragging = false;
let selectedLevel = 1; // current level number for adding (1-7)

// Gate positions (SVG viewBox coordinates: 933.36 x 960)

  // Clear stale data
  localStorage.removeItem('dw-map-gates');
  localStorage.setItem('dw-map-gates-version', GATES_VERSION);

})();

// Free passes (no building, just open passages)

  localStorage.removeItem('dw-map-passes');

// Format: { x, y, level } — level is 1-7

const LEVELS_VERSION = 2;
let LEVEL_MARKERS = (() => {
  try {
    const ver = localStorage.getItem('dw-map-levels-version');
    if (ver && parseInt(ver) === LEVELS_VERSION) {
      const saved = localStorage.getItem('dw-map-levels');
      if (saved) return JSON.parse(saved);
    }
  } catch(e) {}
  localStorage.removeItem('dw-map-levels');

  return DEFAULT_LEVELS.map(l => ({...l}));
})();

// Build swatches
const swatchContainer = document.getElementById('swatches');
PALETTE.forEach((color, i) => {
  const el = document.createElement('div');
  el.className = 'swatch' + (color === currentColor ? ' active' : '');
  el.style.background = color;
  if (color === '#ffffff') el.style.border = '2px solid #555';
  el.addEventListener('click', () => selectColor(color, el));
  swatchContainer.appendChild(el);
});

function selectColor(color, el) {
  currentColor = color;
  eraserMode = false;
  document.getElementById('eraserBtn').textContent = 'Off';
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
}

document.getElementById('customColor').addEventListener('input', (e) => {
  currentColor = e.target.value;
  eraserMode = false;
  document.getElementById('eraserBtn').textContent = 'Off';
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
});

document.getElementById('eraserBtn').addEventListener('click', () => {
  eraserMode = !eraserMode;
  document.getElementById('eraserBtn').textContent = eraserMode ? 'On' : 'Off';
  if (eraserMode) document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
});

const tolInput = document.getElementById('tolerance');
const tolValue = document.getElementById('toleranceValue');
tolInput.addEventListener('input', () => {
  tolerance = parseInt(tolInput.value);
  tolValue.textContent = tolerance;
});

// Zoom
function setZoom(z) {
  zoom = Math.max(0.25, Math.min(4, z));
  const w = (canvas.width * zoom) + 'px';
  const h = (canvas.height * zoom) + 'px';
  canvas.style.width = w;
  canvas.style.height = h;
  overlayCanvas.style.width = w;
  overlayCanvas.style.height = h;
  levelsCanvas.style.width = w;
  levelsCanvas.style.height = h;
  document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
}

document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.25));
document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.25));
document.getElementById('zoomFit').addEventListener('click', fitZoom);

function fitZoom() {
  const cw = container.clientWidth - 40;
  const ch = container.clientHeight - 40;
  const scale = Math.min(cw / canvas.width, ch / canvas.height, 1);
  setZoom(scale);
}

// Watermark
const WATERMARK_TEXT = '[KOO] Angels Reborn #123';

function drawWatermark(targetCtx, w, h) {
  const fontSize = Math.round(w * 0.022);
  targetCtx.save();
  targetCtx.font = `bold ${fontSize}px sans-serif`;

  // Bottom-right
  targetCtx.textAlign = 'right';
  targetCtx.textBaseline = 'bottom';
  targetCtx.fillStyle = 'rgba(0,0,0,0.18)';
  targetCtx.fillText(WATERMARK_TEXT, w - 10, h - 8);
  targetCtx.fillStyle = 'rgba(255,255,255,0.55)';
  targetCtx.fillText(WATERMARK_TEXT, w - 11, h - 9);

  // Top-left
  targetCtx.textAlign = 'left';
  targetCtx.textBaseline = 'top';
  targetCtx.fillStyle = 'rgba(0,0,0,0.18)';
  targetCtx.fillText(WATERMARK_TEXT, 10, 8);
  targetCtx.fillStyle = 'rgba(255,255,255,0.55)';
  targetCtx.fillText(WATERMARK_TEXT, 9, 7);

  targetCtx.restore();
}

// Tribe titles in the top/bottom white bands of the SVG
// SVG viewBox is 933.36 × 960 pt; top band: 0–71pt, bottom band: 889–960pt
function drawTitles(targetCtx, w, h) {
  const fontSize = Math.round(h * 0.038); // fits nicely in the ~71pt band
  targetCtx.save();
  targetCtx.textAlign = 'center';
  targetCtx.textBaseline = 'middle';

  // Top: "Order Tribe" — blue
  targetCtx.font = `bold ${fontSize}px sans-serif`;
  targetCtx.fillStyle = '#1565C0';
  targetCtx.fillText('Order Tribe', w * 0.5, h * (35.52 / 960));

  // Bottom: "Vengeance Union" — red
  targetCtx.fillStyle = '#C62828';
  targetCtx.fillText('Vengeance Union', w * 0.5, h * (924.48 / 960));

  targetCtx.restore();
}

// Load SVG onto canvas
async function loadSVG() {
  const response = await fetch('dw-map-s6.svg');
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    overlayCanvas.width = canvas.width;
    overlayCanvas.height = canvas.height;
    levelsCanvas.width = canvas.width;
    levelsCanvas.height = canvas.height;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    drawTitles(ctx, canvas.width, canvas.height);
    drawWatermark(ctx, canvas.width, canvas.height);
    baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    drawOverlay();
    drawLevels();
    fitZoom();
  };

  img.src = url;
}

// Flood fill
function floodFill(startX, startY, fillColor) {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  const width = canvas.width;
  const height = canvas.height;

  const startIdx = (startY * width + startX) * 4;
  const startR = data[startIdx];
  const startG = data[startIdx + 1];
  const startB = data[startIdx + 2];

  // Parse fill color
  const fr = parseInt(fillColor.slice(1, 3), 16);
  const fg = parseInt(fillColor.slice(3, 5), 16);
  const fb = parseInt(fillColor.slice(5, 7), 16);

  // Don't fill if clicking on the same color
  if (Math.abs(startR - fr) + Math.abs(startG - fg) + Math.abs(startB - fb) < 10) return false;

  const tol = tolerance;
  const visited = new Uint8Array(width * height);

  function matches(idx) {
    const r = data[idx];
    const g = data[idx + 1];
    const b = data[idx + 2];
    return Math.abs(r - startR) + Math.abs(g - startG) + Math.abs(b - startB) <= tol;
  }

  const stack = [startX, startY];
  let filled = false;

  while (stack.length > 0) {
    const y = stack.pop();
    const x = stack.pop();

    if (x < 0 || x >= width || y < 0 || y >= height) continue;

    const pos = y * width + x;
    if (visited[pos]) continue;
    visited[pos] = 1;

    const idx = pos * 4;
    if (!matches(idx)) continue;

    data[idx] = fr;
    data[idx + 1] = fg;
    data[idx + 2] = fb;
    filled = true;

    stack.push(x + 1, y);
    stack.push(x - 1, y);
    stack.push(x, y + 1);
    stack.push(x, y - 1);
  }

  if (filled) {
    ctx.putImageData(imageData, 0, 0);
  }
  return filled;
}

// Canvas click handler
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top) * scaleY);

  if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

  // Save state for undo
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > 50) history.shift();

  const color = eraserMode ? '#ffffff' : currentColor;
  const didFill = floodFill(x, y, color);
  if (!didFill) history.pop();
});

// Undo
function undo() {
  if (history.length === 0) return;
  ctx.putImageData(history.pop(), 0, 0);
}

document.getElementById('undoBtn').addEventListener('click', undo);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undo();
  }
});

// Reset
document.getElementById('resetBtn').addEventListener('click', () => {
  if (baseImageData) {
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(baseImageData, 0, 0);
  }
});

// Export
document.getElementById('exportBtn').addEventListener('click', () => {
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;
  const exportCtx = exportCanvas.getContext('2d');
  exportCtx.drawImage(canvas, 0, 0);
  if (showGates || showPasses) exportCtx.drawImage(overlayCanvas, 0, 0);
  if (showLevels) exportCtx.drawImage(levelsCanvas, 0, 0);
  // Watermark always baked into export
  drawWatermark(exportCtx, exportCanvas.width, exportCanvas.height);
  const link = document.createElement('a');
  link.download = 'dw-s6-map.png';
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
});

// ========== Drawing ==========
const SVG_VIEWBOX_W = 933.36;
const SVG_VIEWBOX_H = 960;

function getScale() {
  return { x: overlayCanvas.width / SVG_VIEWBOX_W, y: overlayCanvas.height / SVG_VIEWBOX_H };
}

function drawOverlay(highlightType, highlightIdx) {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  const s = getScale();

  // Draw gates
  if (showGates) {
    const size = 14 * s.x;
    const half = size / 2;
    const fontSize = Math.round(9 * s.x);

    GATE_MARKERS.forEach((gate, i) => {
      const px = gate.x * s.x;
      const py = gate.y * s.y;
      const hl = highlightType === 'gate' && i === highlightIdx;

      overlayCtx.fillStyle = hl ? '#e94560' : '#000000';
      overlayCtx.fillRect(px - half, py - half, size, size);
      overlayCtx.strokeStyle = hl ? '#ffff00' : '#ffffff';
      overlayCtx.lineWidth = (hl ? 2.5 : 1.5) * s.x;
      overlayCtx.strokeRect(px - half, py - half, size, size);

      overlayCtx.font = `bold ${fontSize}px sans-serif`;
      overlayCtx.textAlign = 'center';
      overlayCtx.fillStyle = hl ? '#e94560' : '#000000';
      overlayCtx.strokeStyle = '#ffffff';
      overlayCtx.lineWidth = 2.5 * s.x;
      overlayCtx.strokeText(gate.label, px, py - half - 4 * s.y);
      overlayCtx.fillText(gate.label, px, py - half - 4 * s.y);
    });
  }

  // Draw free passes as  ]  [  with white gap
  if (showPasses) {
    PASS_MARKERS.forEach((pass, i) => {
      const px = pass.x * s.x;
      const py = pass.y * s.y;
      const angle = (pass.angle || 0) * Math.PI / 180;
      const hl = highlightType === 'pass' && i === highlightIdx;

      overlayCtx.save();
      overlayCtx.translate(px, py);
      overlayCtx.rotate(angle);

      const gap = 4 * s.x;   // half gap between brackets
      const bw = 2 * s.x;    // bracket stroke width
      const bh = 8 * s.x;    // bracket height
      const bt = 3.5 * s.x;  // bracket tick width

      overlayCtx.lineCap = 'round';

      // White fill in the gap between brackets
      overlayCtx.fillStyle = '#ffffff';
      overlayCtx.fillRect(-gap - bw, -bh - bw, 2 * (gap + bw), 2 * (bh + bw));

      // Right bracket  ]  (left side)
      overlayCtx.strokeStyle = hl ? '#e94560' : '#000000';
      overlayCtx.lineWidth = bw;
      overlayCtx.beginPath();
      overlayCtx.moveTo(-gap - bt, -bh);
      overlayCtx.lineTo(-gap, -bh);
      overlayCtx.lineTo(-gap, bh);
      overlayCtx.lineTo(-gap - bt, bh);
      overlayCtx.stroke();

      // Left bracket  [  (right side)
      overlayCtx.beginPath();
      overlayCtx.moveTo(gap + bt, -bh);
      overlayCtx.lineTo(gap, -bh);
      overlayCtx.lineTo(gap, bh);
      overlayCtx.lineTo(gap + bt, bh);
      overlayCtx.stroke();

      overlayCtx.restore();
    });
  }

  // Levels are drawn on a separate top canvas via drawLevels()
}

// Draw levels on the top-most canvas so they stay visible over filled colors
function drawLevels(highlightIdx) {
  levelsCtx.clearRect(0, 0, levelsCanvas.width, levelsCanvas.height);
  if (!showLevels) return;

  const s = getScale();
  const fontSize = Math.round(42 * s.x);
  levelsCtx.font = `bold ${fontSize}px sans-serif`;
  levelsCtx.textAlign = 'center';
  levelsCtx.textBaseline = 'middle';

  LEVEL_MARKERS.forEach((lv, i) => {
    const px = lv.x * s.x;
    const py = lv.y * s.y;
    const hl = i === highlightIdx;

    levelsCtx.globalAlpha = hl ? 0.6 : 0.3;
    levelsCtx.strokeStyle = '#ffffff';
    levelsCtx.lineWidth = 4 * s.x;
    levelsCtx.strokeText(String(lv.level), px, py);
    levelsCtx.fillStyle = hl ? '#e94560' : '#000000';
    levelsCtx.fillText(String(lv.level), px, py);
  });
  levelsCtx.globalAlpha = 1;
  levelsCtx.textBaseline = 'alphabetic';
}

// ========== Hit testing ==========
function findItemAt(vx, vy, type, threshold) {
  const t = threshold || 15;
  const arr = type === 'gate' ? GATE_MARKERS : type === 'pass' ? PASS_MARKERS : LEVEL_MARKERS;
  let bestIdx = -1, bestDist = Infinity;
  arr.forEach((item, i) => {
    const d = Math.hypot(item.x - vx, item.y - vy);
    if (d < t && d < bestDist) { bestDist = d; bestIdx = i; }
  });
  return bestIdx;
}

function eventToViewBox(e) {
  const rect = overlayCanvas.getBoundingClientRect();
  const s = getScale();
  const cx = (e.clientX - rect.left) * (overlayCanvas.width / rect.width);
  const cy = (e.clientY - rect.top) * (overlayCanvas.height / rect.height);
  return { x: cx / s.x, y: cy / s.y };
}

function getActiveArray() {
  return editTarget === 'gates' ? GATE_MARKERS : editTarget === 'passes' ? PASS_MARKERS : LEVEL_MARKERS;
}
function getActiveType() {
  return editTarget === 'gates' ? 'gate' : editTarget === 'passes' ? 'pass' : 'level';
}

// ========== Redraw helpers ==========
function highlightItem(type, idx) {
  if (type === 'level') { drawOverlay(); drawLevels(idx); }
  else { drawOverlay(type, idx); drawLevels(); }
}
function redrawAll() { drawOverlay(); drawLevels(); }

// ========== Mouse events ==========
overlayCanvas.addEventListener('mousedown', (e) => {
  if (!editMode) return;
  const v = eventToViewBox(e);
  const arr = getActiveArray();
  const type = getActiveType();

  if (editTool === 'move') {
    const idx = findItemAt(v.x, v.y, type, 20);
    if (idx >= 0) {
      dragIndex = idx;
      isDragging = true;
      overlayCanvas.style.cursor = 'grabbing';
      highlightItem(type, idx);
    }
  } else if (editTool === 'delete') {
    const idx = findItemAt(v.x, v.y, type, 20);
    if (idx >= 0) { arr.splice(idx, 1); redrawAll(); }
  } else if (editTool === 'add') {
    if (editTarget === 'gates') {
      const label = prompt('Gate label:', 'Gate');
      if (label !== null) {
        arr.push({ x: Math.round(v.x), y: Math.round(v.y), label });
        redrawAll();
      }
    } else if (editTarget === 'passes') {
      arr.push({ x: Math.round(v.x), y: Math.round(v.y), angle: 0 });
      redrawAll();
    } else {
      arr.push({ x: Math.round(v.x), y: Math.round(v.y), level: selectedLevel });
      redrawAll();
    }
  } else if (editTool === 'rotate') {
    const idx = findItemAt(v.x, v.y, type, 20);
    if (idx >= 0) {
      arr[idx].angle = ((arr[idx].angle || 0) + 15) % 360;
      highlightItem(type, idx);
    }
  }
});

overlayCanvas.addEventListener('mousemove', (e) => {
  if (!editMode) return;
  const v = eventToViewBox(e);
  const type = getActiveType();

  if (isDragging && dragIndex >= 0) {
    const arr = getActiveArray();
    arr[dragIndex].x = Math.round(v.x);
    arr[dragIndex].y = Math.round(v.y);
    highlightItem(type, dragIndex);
  } else if (editTool === 'move' || editTool === 'delete' || editTool === 'rotate') {
    const idx = findItemAt(v.x, v.y, type, 20);
    highlightItem(type, idx);
    const cursors = { move: 'grab', delete: 'pointer', rotate: 'pointer' };
    overlayCanvas.style.cursor = idx >= 0 ? cursors[editTool] : 'default';
  }
});

overlayCanvas.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; dragIndex = -1; overlayCanvas.style.cursor = 'grab'; redrawAll(); }
});
overlayCanvas.addEventListener('mouseleave', () => {
  if (isDragging) { isDragging = false; dragIndex = -1; redrawAll(); }
});

// ========== Edit toolbar ==========
function setEditTool(tool) {
  editTool = tool;
  document.getElementById('editMoveBtn').classList.toggle('edit-active', tool === 'move');
  document.getElementById('editAddBtn').classList.toggle('edit-active', tool === 'add');
  document.getElementById('editRotateBtn').classList.toggle('edit-active', tool === 'rotate');
  document.getElementById('editDeleteBtn').classList.toggle('edit-active', tool === 'delete');
  overlayCanvas.className = tool === 'add' ? 'adding' : 'editing';
  updateEditHint();
}

function updateEditHint() {
  const name = editTarget === 'gates' ? 'gate' : editTarget === 'passes' ? 'pass' : 'level';
  const hints = {
    move: `Drag a ${name} to move it`,
    add: editTarget === 'levels' ? `Click to place level ${selectedLevel}` : `Click to place a new ${name}`,
    delete: `Click a ${name} to remove it`,
    rotate: `Click a ${name} to rotate 15°`
  };
  document.getElementById('editHint').textContent = hints[editTool] || '';
}

function flashHint(msg) {
  document.getElementById('editHint').textContent = msg;
  setTimeout(updateEditHint, 2000);
}

function openEditor(target) {
  editTarget = target;
  editMode = true;
  if (target === 'passes') { showPasses = true; document.getElementById('passesBtn').textContent = 'Passes: On'; document.getElementById('passesBtn').classList.add('active'); }
  else if (target === 'levels') { showLevels = true; document.getElementById('levelsBtn').textContent = 'Levels: On'; document.getElementById('levelsBtn').classList.add('active'); }
  else { showGates = true; document.getElementById('gatesBtn').textContent = 'Gates: On'; document.getElementById('gatesBtn').classList.add('active'); }
  const labels = { gates: 'Gate Editor:', passes: 'Pass Editor:', levels: 'Level Editor:' };
  document.getElementById('editLabel').textContent = labels[target];
  document.getElementById('editRotateBtn').style.display = target === 'passes' ? '' : 'none';
  document.getElementById('levelPicker').style.display = target === 'levels' ? '' : 'none';
  document.getElementById('editBar').style.display = 'flex';
  setEditTool('move');
  redrawAll();
}

document.getElementById('editMoveBtn').addEventListener('click', () => setEditTool('move'));
document.getElementById('editAddBtn').addEventListener('click', () => setEditTool('add'));
document.getElementById('editRotateBtn').addEventListener('click', () => setEditTool('rotate'));
document.getElementById('editDeleteBtn').addEventListener('click', () => setEditTool('delete'));

// Edit dropdown
const editDropdown = document.getElementById('editDropdown');
document.getElementById('editToggleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  editDropdown.classList.toggle('open');
});
document.addEventListener('click', () => editDropdown.classList.remove('open'));

document.getElementById('editGatesBtn').addEventListener('click', () => { editDropdown.classList.remove('open'); openEditor('gates'); });
document.getElementById('editPassesBtn').addEventListener('click', () => { editDropdown.classList.remove('open'); openEditor('passes'); });
document.getElementById('editLevelsBtn').addEventListener('click', () => { editDropdown.classList.remove('open'); openEditor('levels'); });

// Level picker buttons
document.querySelectorAll('#levelPicker [data-lvl]').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedLevel = parseInt(btn.dataset.lvl);
    document.querySelectorAll('#levelPicker [data-lvl]').forEach(b => b.classList.remove('edit-active'));
    btn.classList.add('edit-active');
    updateEditHint();
  });
});

document.getElementById('editDoneBtn').addEventListener('click', () => {
  editMode = false; isDragging = false; dragIndex = -1;
  document.getElementById('editBar').style.display = 'none';
  overlayCanvas.className = '';
  redrawAll();
});

// Save
document.getElementById('editSaveBtn').addEventListener('click', () => {
  if (editTarget === 'gates') {
    localStorage.setItem('dw-map-gates', JSON.stringify(GATE_MARKERS));
    localStorage.setItem('dw-map-gates-version', GATES_VERSION);
  } else if (editTarget === 'passes') {
    localStorage.setItem('dw-map-passes', JSON.stringify(PASS_MARKERS));
    localStorage.setItem('dw-map-passes-version', PASSES_VERSION);
  } else {
    localStorage.setItem('dw-map-levels', JSON.stringify(LEVEL_MARKERS));
    localStorage.setItem('dw-map-levels-version', LEVELS_VERSION);
  }
  flashHint('Saved!');
});

// Copy JSON
document.getElementById('editExportJsonBtn').addEventListener('click', () => {
  const data = editTarget === 'gates' ? GATE_MARKERS : editTarget === 'passes' ? PASS_MARKERS : LEVEL_MARKERS;
  navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => flashHint('Copied to clipboard!'));
});

// Toggle buttons
document.getElementById('gatesBtn').addEventListener('click', () => {
  showGates = !showGates;
  document.getElementById('gatesBtn').textContent = showGates ? 'Gates: On' : 'Gates: Off';
  document.getElementById('gatesBtn').classList.toggle('active', showGates);
  redrawAll();
});

document.getElementById('passesBtn').addEventListener('click', () => {
  showPasses = !showPasses;
  document.getElementById('passesBtn').textContent = showPasses ? 'Passes: On' : 'Passes: Off';
  document.getElementById('passesBtn').classList.toggle('active', showPasses);
  redrawAll();
});

document.getElementById('levelsBtn').addEventListener('click', () => {
  showLevels = !showLevels;
  document.getElementById('levelsBtn').textContent = showLevels ? 'Levels: On' : 'Levels: Off';
  document.getElementById('levelsBtn').classList.toggle('active', showLevels);
  redrawAll();
});

loadSVG();
</script>
